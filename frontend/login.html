<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login – Groove</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet" />
    <style>
         :root {
            --green: #1ed760;
            --green-dim: #1db954;
            --bg: #000;
            --card: #121212;
            --input-bg: #121212;
            --border: #727272;
            --text: #fff;
            --muted: #a7a7a7;
        }
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        html,
        body {
            min-height: 100%;
            font-family: Inter, system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            -webkit-font-smoothing: antialiased;
        }
        /* Top bar like Spotify */
        
        .top {
            display: flex;
            align-items: center;
            padding: 32px 48px 24px;
            border-bottom: 1px solid #282828;
        }
        
        .top svg {
            width: 40px;
            height: 40px;
        }
        
        .wrap {
            display: flex;
            justify-content: center;
            padding: 32px 16px 64px;
        }
        
        .card {
            width: 100%;
            max-width: 450px;
            background: var(--card);
            border-radius: 12px;
            padding: 40px 48px 48px;
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.6);
        }
        
        @media (max-width: 560px) {
            .top {
                padding: 24px 20px;
            }
            .card {
                background: transparent;
                box-shadow: none;
                padding: 24px 8px;
                max-width: 100%;
            }
        }
        
        .brand {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            margin-bottom: 36px;
        }
        
        .brand svg {
            width: 48px;
            height: 48px;
        }
        
        .brand h1 {
            font-size: 1.75rem;
            font-weight: 900;
            letter-spacing: -0.5px;
            text-align: center;
        }
        
        .error-msg {
            display: none;
            background: #e91429;
            color: #fff;
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 500;
            margin-bottom: 20px;
            line-height: 1.4;
        }
        
        .success-msg {
            display: none;
            background: #1ed760;
            color: #000;
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            font-size: 0.85rem;
            font-weight: 700;
            margin-bottom: 8px;
            margin-top: 16px;
        }
        
        label:first-of-type {
            margin-top: 0;
        }
        
        .field {
            position: relative;
        }
        
        input[type="text"],
        input[type="email"],
        input[type="password"] {
            width: 100%;
            background: #121212;
            border: 1px solid #727272;
            border-radius: 4px;
            padding: 14px 14px;
            color: #fff;
            font-size: 1rem;
            font-family: inherit;
            outline: none;
            transition: border-color 0.15s, box-shadow 0.15s;
        }
        
        input:hover {
            border-color: #fff;
        }
        
        input:focus {
            border-color: #fff;
            box-shadow: 0 0 0 1px #fff;
        }
        
        input::placeholder {
            color: #6a6a6a;
        }
        
        .toggle-pw {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #a7a7a7;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
            padding: 4px 6px;
        }
        
        .toggle-pw:hover {
            color: #fff;
        }
        
        .btn-primary {
            width: 100%;
            margin-top: 28px;
            background: var(--green);
            color: #000;
            border: none;
            border-radius: 500px;
            padding: 16px 24px;
            font-size: 1rem;
            font-weight: 700;
            font-family: inherit;
            cursor: pointer;
            transition: transform 0.1s, background 0.15s;
        }
        
        .btn-primary:hover {
            background: #1fdf64;
            transform: scale(1.02);
        }
        
        .btn-primary:active {
            transform: scale(1);
        }
        
        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        .divider {
            display: flex;
            align-items: center;
            gap: 16px;
            margin: 28px 0;
            color: #7c7c7c;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 1px;
        }
        
        .divider::before,
        .divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background: #292929;
        }
        
        .hint {
            text-align: center;
            color: var(--muted);
            font-size: 0.85rem;
            margin-top: 8px;
            line-height: 1.5;
        }
        
        .switch {
            text-align: center;
            margin-top: 32px;
            padding-top: 24px;
            border-top: 1px solid #292929;
            color: var(--muted);
            font-size: 0.95rem;
        }
        
        .switch a {
            color: #fff;
            font-weight: 700;
            text-decoration: underline;
            cursor: pointer;
            margin-left: 6px;
        }
        
        .switch a:hover {
            color: var(--green);
        }
        
        .hidden {
            display: none !important;
        }
        
        .footer-note {
            text-align: center;
            color: #6a6a6a;
            font-size: 0.7rem;
            margin-top: 40px;
            line-height: 1.5;
            max-width: 450px;
            margin-left: auto;
            margin-right: auto;
            padding: 0 16px 32px;
        }
        /* Ambient glow */
        
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background: radial-gradient(ellipse 80% 50% at 50% -20%, rgba(30, 215, 96, 0.12), transparent 60%), radial-gradient(ellipse 60% 40% at 100% 100%, rgba(30, 215, 96, 0.05), transparent 50%);
            pointer-events: none;
            z-index: 0;
        }
        
        .top,
        .wrap,
        .footer-note {
            position: relative;
            z-index: 1;
        }
    </style>
</head>

<body>
    <header class="top">
        <svg viewBox="0 0 24 24" fill="#1ed760" aria-hidden="true">
      <path d="M12 0C5.4 0 0 5.4 0 12s5.4 12 12 12 12-5.4 12-12S18.66 0 12 0zm5.521 17.34c-.24.359-.66.48-1.021.24-2.82-1.74-6.36-2.101-10.561-1.141-.418.122-.779-.179-.899-.539-.12-.421.18-.78.54-.9 4.56-1.021 8.52-.6 11.64 1.32.42.18.479.659.301 1.02zm1.44-3.3c-.301.42-.841.6-1.262.3-3.239-1.98-8.159-2.58-11.939-1.38-.479.12-1.02-.12-1.14-.6-.12-.48.12-1.021.6-1.141C9.6 9.9 15 10.561 18.72 12.84c.361.181.54.78.241 1.2zm.12-3.36C15.24 8.4 8.82 8.16 5.16 9.301c-.6.179-1.2-.181-1.38-.721-.18-.601.18-1.2.72-1.381 4.26-1.26 11.28-1.02 15.721 1.621.539.3.719 1.02.419 1.56-.299.421-1.02.599-1.559.3z"/>
    </svg>
    </header>

    <div class="wrap">
        <div class="card">
            <div class="brand">
                <svg viewBox="0 0 24 24" fill="#1ed760">
          <path d="M12 0C5.4 0 0 5.4 0 12s5.4 12 12 12 12-5.4 12-12S18.66 0 12 0zm5.521 17.34c-.24.359-.66.48-1.021.24-2.82-1.74-6.36-2.101-10.561-1.141-.418.122-.779-.179-.899-.539-.12-.421.18-.78.54-.9 4.56-1.021 8.52-.6 11.64 1.32.42.18.479.659.301 1.02zm1.44-3.3c-.301.42-.841.6-1.262.3-3.239-1.98-8.159-2.58-11.939-1.38-.479.12-1.02-.12-1.14-.6-.12-.48.12-1.021.6-1.141C9.6 9.9 15 10.561 18.72 12.84c.361.181.54.78.241 1.2zm.12-3.36C15.24 8.4 8.82 8.16 5.16 9.301c-.6.179-1.2-.181-1.38-.721-.18-.601.18-1.2.72-1.381 4.26-1.26 11.28-1.02 15.721 1.621.539.3.719 1.02.419 1.56-.299.421-1.02.599-1.559.3z"/>
        </svg>
                <h1 id="heading">Log in to Groove</h1>
            </div>

            <div class="error-msg" id="error"></div>
            <div class="success-msg" id="success"></div>

            <form id="auth-form" autocomplete="on">
                <div id="name-field" class="hidden">
                    <label for="full_name">Display name</label>
                    <input type="text" id="full_name" name="name" placeholder="What should we call you?" autocomplete="name" />
                </div>

                <label for="email">Email address</label>
                <input type="email" id="email" name="email" required placeholder="name@domain.com" autocomplete="email" />

                <label for="password">Password</label>
                <div class="field">
                    <input type="password" id="password" name="password" required minlength="6" placeholder="Password" autocomplete="current-password" />
                    <button type="button" class="toggle-pw" id="toggle-pw" tabindex="-1">Show</button>
                </div>

                <button type="submit" class="btn-primary" id="submit-btn">Log In</button>
            </form>

            <div class="divider">OR</div>
            <p class="hint">Use the same email you registered with Supabase.<br />Voice + Nova chat work after login.</p>

            <p class="switch">
                <span id="switch-text">Don't have an account?</span>
                <a id="switch-link">Sign up for Groove</a>
            </p>
        </div>
    </div>

    <p class="footer-note">
        This is a fan-made music demo (Groove). Not affiliated with Spotify.<br /> By continuing you agree to explore music with Nova.
    </p>

    <script src="js/auth.js"></script>
    <script>
        let isSignup = false;
        const form = document.getElementById("auth-form");
        const errorEl = document.getElementById("error");
        const successEl = document.getElementById("success");
        const switchLink = document.getElementById("switch-link");
        const switchText = document.getElementById("switch-text");
        const submitBtn = document.getElementById("submit-btn");
        const nameField = document.getElementById("name-field");
        const heading = document.getElementById("heading");
        const pwInput = document.getElementById("password");
        const togglePw = document.getElementById("toggle-pw");

        if (Auth.getToken()) {
            window.location.href = "index.html";
        }

        togglePw.addEventListener("click", () => {
            const show = pwInput.type === "password";
            pwInput.type = show ? "text" : "password";
            togglePw.textContent = show ? "Hide" : "Show";
        });

        switchLink.addEventListener("click", () => {
            isSignup = !isSignup;
            errorEl.style.display = "none";
            successEl.style.display = "none";
            if (isSignup) {
                switchText.textContent = "Already have an account?";
                switchLink.textContent = "Log in here";
                submitBtn.textContent = "Sign Up";
                heading.textContent = "Sign up to start listening";
                nameField.classList.remove("hidden");
                pwInput.autocomplete = "new-password";
            } else {
                switchText.textContent = "Don't have an account?";
                switchLink.textContent = "Sign up for Groove";
                submitBtn.textContent = "Log In";
                heading.textContent = "Log in to Groove";
                nameField.classList.add("hidden");
                pwInput.autocomplete = "current-password";
            }
        });

        form.addEventListener("submit", async(e) => {
            e.preventDefault();
            errorEl.style.display = "none";
            successEl.style.display = "none";
            submitBtn.disabled = true;
            const prev = submitBtn.textContent;
            submitBtn.textContent = isSignup ? "Creating account…" : "Logging in…";

            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value;
            const full_name = document.getElementById("full_name").value.trim();

            try {
                if (isSignup) {
                    await Auth.signUp(email, password, full_name);
                    successEl.textContent = "Account created — welcome to Groove!";
                    successEl.style.display = "block";
                } else {
                    await Auth.signIn(email, password);
                }
                setTimeout(() => {
                    window.location.href = "index.html";
                }, 400);
            } catch (err) {
                errorEl.textContent = err.message || "Something went wrong";
                errorEl.style.display = "block";
                submitBtn.disabled = false;
                submitBtn.textContent = prev;
            }
        });
    </script>
</body>

</html>
